<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stats</title>
<style>
:root{--bg:#0a0a0b;--card:#141416;--line:#26262a;--fg:#f4f4f2;--mute:#8a8a90;--acc:#6b9bff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif;padding:40px max(16px,env(safe-area-inset-left))}
main{max-width:900px;margin:auto}h1{margin:0 0 4px;font-size:28px}.sub{color:var(--mute);margin:0 0 28px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
a.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;color:inherit;text-decoration:none}
a.card:hover,a.card:focus-visible{border-color:var(--acc);outline:none}
.tag{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--acc)}.t{font-size:18px;font-weight:650;margin:6px 0}.d{color:var(--mute);font-size:14px}
</style></head><body><main>
<h1>Stats</h1><p class="sub">Private dashboard for Shovon's Space apps.</p>
<div class="grid" id="g"></div>
<script>
fetch('cards.json',{cache:'no-store'}).then(r=>r.json()).then(function(cs){
 var g=document.getElementById('g');
 cs.forEach(function(c){var a=document.createElement('a');a.className='card';a.href=c.href;
  [['tag',c.tag],['t',c.title],['d',c.desc]].forEach(function(p){var d=document.createElement('div');d.className=p[0];d.textContent=p[1]||'';a.appendChild(d)});
  g.appendChild(a)});
}).catch(function(){document.getElementById('g').textContent='Could not load cards.json'});
</script></main></body></html>
