<!doctype html><meta charset="utf-8"><title>Space Prompter migration</title>
<script>
// Answers one question from prompter.shovonix.dev: "send me the saved state".
// Replies only to that exact origin. Read-only; nothing here ever writes.
addEventListener('message',function(e){
  if(e.origin!=='https://prompter.shovonix.dev'||e.data!=='sp-migrate?')return;
  var v=null;try{v=localStorage.getItem('glassPrompterState')}catch(_){}
  e.source.postMessage({sp:'migrate',state:v},e.origin);
});
</script>
